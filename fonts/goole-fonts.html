<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Google Fonts</title>
    <link rel='stylesheet' href='style.css'>

    <!-- connect tp google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- load roboto -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


</head>
<body>
    <h1>video ah</h1>
    <p>watch video - choose size</p>

    <!-- video size control buttons -->
    <div class="sizeControls">
        <strong>video size:</strong>
        <button onclick="changeSize('small')">Small</button>
        <button onclick="changeSize('medium')">Medium</button>
        <button onclick="changeSize('large')">Large</button>
        <button onclick="changeSize('full')">Full</button> <!-- fills the screen -->
    </div>

    <!-- video player -->
    <video id="myVideo" class="full" controls>
        <sourcesrc="video.mp4" type="video/mp4">

        sorry video not working
    </video>

    <script>
        function changeSize(size) {
            const video = document.getElementById("myVideo");

            video.classList.remove(
                "small",
                "medium",
                "large",
                "full"
            )

            video.classList.add(size);
        }

    </script>
    
    
</body>
</html>
