<!DOCTYPE html>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;
            background-color: black;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            object-fit: cover; /* fills w/out streching video */

            z-index: -1;
        }
